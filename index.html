<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stav Sahar</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#F1EADA;
            color:#2C3424;

            font-family:Inter,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

        }

        .container{

            text-align:center;

        }

        h1{

            font-family:"Cormorant Garamond",serif;
            font-size:72px;
            letter-spacing:6px;

        }

        p{

            margin-top:20px;
            font-size:22px;
            color:#4C583E;

        }

        a{

            margin-top:45px;

            display:inline-block;

            text-decoration:none;

            background:#B59E7D;
            color:white;

            padding:18px 40px;

            border-radius:50px;

            transition:.3s;

        }

        a:hover{

            background:#584738;
            transform:translateY(-3px);

        }

    </style>

</head>

<body>

<div class="container">

<h1>STAV SAHAR</h1>

<p>Clarity. Confidence. Direction.</p>

<a href="#">Book Your Session</a>

</div>

</body>
</html>
